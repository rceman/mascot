[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "i2v-bench"
version = "0.1.0"
description = "Local image-to-video benchmark harness for Mascot (RTX 4070 12 GB, dev tooling only)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "diffusers>=0.34",
    "transformers>=4.50",
    "accelerate>=1.0",
    "sentencepiece",
    "pillow",
    "psutil",
    "regex",
    "ftfy",
    "huggingface-hub>=0.30",
    "bitsandbytes>=0.50",
    "protobuf",
    "tiktoken",
]

[project.scripts]
i2v-bench = "i2v_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
