[package]
name = "mascot-rust"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mascot"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
png = "=0.18.1"
base64 = "=0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = [
    "NSString",
    "NSArray",
    "NSNotification",
    "NSEnumerator",
    "NSThread",
    "NSAttributedString",
    "NSNull",
] }
objc2-app-kit = { version = "=0.3.2", features = [
    "NSApplication",
    "NSPanel",
    "NSWindow",
    "NSView",
    "NSTextView",
    "NSTextStorage",
    "NSScrollView",
    "NSImage",
    "NSButton",
    "NSEvent",
    "NSResponder",
    "NSTextField",
    "NSColor",
    "NSScreen",
    "NSText",
    "NSFont",
    "NSBitmapImageRep",
    "NSGraphicsContext",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
