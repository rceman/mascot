[workspace]
resolver = "3"
members = [
    "crates/mascot-animation",
    "crates/mascot-render-win32",
    "crates/mascot-character",
    "apps/mascot-animation-lab",
    "apps/mascotctl",
]
# The v0.1 prototype app is an independent package with its own lockfile.
exclude = ["rust"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
mascot-animation = { path = "crates/mascot-animation" }
mascot-render-win32 = { path = "crates/mascot-render-win32" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
png = "=0.18.1"
sha2 = "=0.10.8"
windows-numerics = "=0.3.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

# SDF rasterization is too slow for the ~10s debug-test budget.
[profile.dev.package.mascot-character]
opt-level = 2
